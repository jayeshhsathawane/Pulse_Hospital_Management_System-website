{% extends 'reception/reception_dashboard.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- 🟢 CSS for Smooth Scrolling & Mobile Layout -->
<style>
    /* Prevent body scroll but allow main container scroll if needed */
    .main-wrapper {
        height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    
    /* Ensure the submit button doesn't get cut off on small screens */
    .form-container {
        padding-bottom: 5rem; /* Extra padding for mobile bottom nav/spacing */
    }

    @media (max-width: 640px) {
        .form-section {
            padding: 1rem !important;
        }
    }
</style>

<div class="main-wrapper bg-slate-50 min-h-screen">
    <div class="max-w-5xl mx-auto p-4 sm:p-6 form-container">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 pb-4 border-b border-slate-200">
            <div class="flex items-center gap-4">
                <div class="h-10 w-10 bg-green-50 text-green-600 rounded-md flex items-center justify-center text-lg border border-green-100 shadow-sm shrink-0">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <div>
                    <h2 class="text-lg font-black text-slate-800 uppercase tracking-tight">OPD Registration</h2>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">New Patient Entry & Queueing</p>
                </div>
            </div>
            <div class="w-full md:w-auto">
                <span class="inline-flex items-center px-3 py-1.5 rounded-md bg-white border border-slate-200 text-[10px] font-black text-slate-500 uppercase tracking-widest shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                    Live Token System
                </span>
            </div>
        </div>

        <form id="appointmentForm" method="POST" class="space-y-6 mt-6">
            {% csrf_token %}

            <!-- Patient Lookup Section -->
            <div class="bg-white rounded-md border border-slate-200 shadow-sm overflow-hidden border-t-4 border-t-green-500">
                <div class="p-4 sm:p-5"> 
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1"> 
                        <i class="fas fa-search mr-1.5 text-green-600"></i> Patient Lookup
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fas fa-phone-alt text-slate-400 group-focus-within:text-green-600 transition-colors text-sm"></i> 
                        </div>
                        <input type="text" name="phone" id="phone_search" required 
                               value="{{ pre_fill.phone|default:'' }}"
                               class="w-full pl-10 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-md outline-none text-sm font-bold text-slate-800 placeholder-slate-400 focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all shadow-sm"
                               placeholder="Mobile No or Reg ID">
                        
                        <div id="search_spinner" class="hidden absolute right-4 top-3 text-green-600"> 
                            <i class="fas fa-circle-notch fa-spin"></i>
                        </div>
                    </div>
                    <!-- Status message container -->
                    <div class="mt-2 h-5">
                        <span id="patient_status" class="text-[9px] font-black tracking-wide hidden"></span>
                    </div>
                </div>
            </div>

            <!-- Two Column Layout -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Left Side: Details -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white rounded-md border border-slate-200 shadow-sm p-4 sm:p-6 form-section">
                        <div class="flex items-center gap-2 mb-6 border-b border-slate-100 pb-3">
                            <i class="fas fa-user-tag text-slate-400"></i>
                            <h3 class="text-xs font-black text-slate-700 uppercase tracking-widest">Personal Details</h3>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="md:col-span-2 group">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Full Name</label>
                                <input type="text" name="patient_name" required value="{{ pre_fill.name|default:'' }}"
                                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-md outline-none text-sm font-bold text-slate-700 focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all">
                            </div>

                            <div class="group relative">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Age</label>
                                <input type="number" name="age" required 
                                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-md outline-none text-sm font-bold text-slate-700 focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all">
                                <span class="absolute right-4 top-[2.1rem] text-[9px] font-bold text-slate-400 pointer-events-none">YRS</span>
                            </div>

                            <div class="group relative">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Gender</label>
                                <select name="gender" required 
                                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-md outline-none text-sm font-bold text-slate-700 focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all appearance-none cursor-pointer">
                                    <option value="">Select...</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                                <i class="fas fa-chevron-down absolute right-4 top-[2.2rem] text-xs text-slate-400 pointer-events-none"></i>
                            </div>

                            <div class="md:col-span-2 group">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Address / Location</label>
                                <input type="text" name="address" value="{{ pre_fill.address|default:'' }}"
                                       class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-md outline-none text-sm font-medium text-slate-700 focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all"
                                       placeholder="House No, Street, City...">
                            </div>

                            <div class="md:col-span-2 group">
                                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Referred By (Optional)</label>
                                <div class="relative">
                                    <i class="fas fa-user-md absolute left-4 top-3 text-slate-400 text-xs"></i>
                                    <input type="text" name="referred_by" placeholder="External Doctor Name..." 
                                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-md outline-none text-sm font-medium text-slate-700 focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Side: Vitals & Action -->
                <div class="lg:col-span-1 space-y-6">
                    
                    <div class="bg-green-50/30 rounded-md border border-green-100 p-4 sm:p-5">
                        <div class="flex items-center gap-2 mb-4">
                            <i class="fas fa-heartbeat text-green-600"></i>
                            <h3 class="text-xs font-black text-green-700 uppercase tracking-widest">Clinical Vitals</h3>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-white p-2 rounded-md border border-green-100 shadow-sm text-center">
                                <label class="block text-[9px] font-black text-slate-400 uppercase mb-1">B.P.</label>
                                <input type="text" name="bp" placeholder="120/80" 
                                       class="w-full bg-transparent outline-none text-sm font-black text-slate-700 text-center placeholder-slate-300">
                            </div>

                            <div class="bg-white p-2 rounded-md border border-green-100 shadow-sm text-center">
                                <label class="block text-[9px] font-black text-slate-400 uppercase mb-1">Pulse</label>
                                <input type="text" name="pulse" placeholder="72" 
                                       class="w-full bg-transparent outline-none text-sm font-black text-slate-700 text-center placeholder-slate-300">
                            </div>

                            <div class="bg-white p-2 rounded-md border border-green-100 shadow-sm text-center">
                                <label class="block text-[9px] font-black text-slate-400 uppercase mb-1">Sugar</label>
                                <input type="text" name="sugar" placeholder="110" 
                                       class="w-full bg-transparent outline-none text-sm font-black text-slate-700 text-center placeholder-slate-300">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-md border border-slate-200 shadow-sm p-4 sm:p-5">
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2">Assign Consultant</label>
                        <div class="relative">
                            <i class="fas fa-stethoscope absolute left-4 top-3 text-green-600 text-sm"></i>
                            <select name="doctor" id="doctor_select" required 
                                    class="w-full pl-10 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-md outline-none text-sm font-bold text-slate-700 focus:bg-white focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition-all appearance-none cursor-pointer">
                                <option value="" class="text-slate-400">-- Select Doctor --</option>
                                {% for doc in doctors %}
                                    <option value="{{ doc.id }}">Dr. {{ doc.name }}</option>
                                {% endfor %}
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-3.5 text-xs text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" 
                            class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-md font-black text-xs shadow-md transition-all transform active:scale-95 uppercase tracking-[0.1em] flex items-center justify-center gap-2 group sticky bottom-2 sm:relative">
                        <span>Confirm Appointment</span>
                        <i class="fas fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                    </button>

                </div>
            </div>
        </form>
    </div>
</div>

<script>
    const appointmentForm = document.getElementById('appointmentForm');
    const phoneInput = document.getElementById('phone_search');

    window.addEventListener('DOMContentLoaded', () => {
        if (phoneInput.value.length >= 4) { searchPatient(); }
    });

    appointmentForm.addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'info',
            title: 'Allocating Token...',
            showConfirmButton: false,
            timer: 1500,
            timerProgressBar: true,
            background: '#fff',
            customClass: {
                popup: 'rounded-md border border-slate-100 shadow-lg',
                title: 'text-sm font-bold text-slate-700'
            },
            didOpen: () => { Swal.showLoading(); }
        });

        setTimeout(() => { appointmentForm.submit(); }, 800);
    });

    phoneInput.addEventListener('input', searchPatient);

    function searchPatient() {
        let q = phoneInput.value;
        let statusSpan = document.getElementById('patient_status');

        if (q.length >= 3) {
            document.getElementById('search_spinner').classList.remove('hidden');
            fetch(`/api/search-patient/?q=${encodeURIComponent(q)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('search_spinner').classList.add('hidden');
                    statusSpan.classList.remove('hidden');
                    if (data.exists) {
                        document.querySelector('input[name="patient_name"]').value = data.name;
                        document.querySelector('input[name="age"]').value = data.age;
                        document.querySelector('input[name="address"]').value = data.address;
                        if (data.gender) { document.querySelector('select[name="gender"]').value = data.gender; }
                        
                        statusSpan.innerHTML = `<i class="fas fa-check-circle mr-1"></i> RECORD FOUND: ${data.name} (${data.reg_number})`;
                        statusSpan.className = "text-[10px] font-black text-green-600 uppercase tracking-tight bg-green-50 px-2 py-0.5 rounded-sm inline-block mt-1";
                    } else {
                        statusSpan.innerHTML = `<i class="fas fa-user-plus mr-1"></i> NEW REGISTRATION`;
                        statusSpan.className = "text-[10px] font-black text-green-600 uppercase tracking-tight bg-green-50 border border-green-100 px-2 py-0.5 rounded-sm inline-block mt-1";
                    }
                })
                .catch(err => { 
                    document.getElementById('search_spinner').classList.add('hidden');
                    console.error("Search failed:", err);
                });
        } else {
            statusSpan.innerText = "";
            statusSpan.classList.add('hidden');
        }
    }
</script>
{% endblock %}
